# Chat with the server persona. No tools, voice or scheduled tasks.
# Secrets are injected by /etc/discord-ai-bot/env on the VDS.
bot_token: ${DISCORD_BOT_TOKEN}
client_id: ${DISCORD_CLIENT_ID}
status_message: Gemini + Groq
max_text: 12000
max_images: 2
max_messages: 12
use_plain_responses: true
show_embed_color: false
allow_dms: false
enable_voice: true
enable_message_content: false # Mention/reply chat works without privileged content access.
memory:
  enabled: false # Enable together with Discord's Message Content Intent.
  guild_ids: [] # Explicit server scope; no DMs.
  excluded_channel_ids: []
  data_dir: /var/lib/discord-ai-memory
  command: /opt/discord-memory-venv/bin/bm
  model: groq/openai/gpt-oss-120b
  analysis_interval_seconds: 300
  max_analysis_calls_per_day: 40
enable_scheduled_tasks: false
spontaneous_chat:
  enabled: true
  cooldown_seconds: 900 # 15 minutes between spontaneous interjections
  min_user_messages: 12 # Minimum user messages accumulated before chiming in
  probability: 0.15 # 15% random chance when threshold is reached
  boost_probability: 0.40 # 40% chance if drama/tilt keywords or ALL CAPS detected
system_prompt: "Kullanıcıyla Türkçe konuş. Normal sohbette samimi, doğal ve esprili ol. Ancak kullanıcı kişilik analizi, karakter özeti, geçmiş hafıza veya detaylı bir inceleme istediğinde; araçlardan gelen somut mesaj alıntılarına, tarihlere ve kanıtlara dayanarak derinlemesine, zeki, gözlemci ve kapsamlı yanıt ver. Asla 'en çok konuşansın' gibi yüzeysel geçiştirmeler yapma."
persona: sunucu-kankasi
permissions:
  users:
    admin_ids: []
    allowed_ids: []
    blocked_ids: []
  roles:
    allowed_ids: []
    blocked_ids: []
  channels:
    allowed_ids: [] # Restrict to the chosen test channel before starting.
    blocked_ids: []
providers:
  google:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key: ${GEMINI_API_KEY}
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key: ${GROQ_API_KEY}
models:
  google/gemini-3.5-flash-lite:
    tools:
      - web_search
      - get_weather
      - get_market_prices
      - visuals_core
      - calculate
      - get_current_time
      - wikipedia_search
      - set_reminder
      - read_url
      - get_user_profile
      - analyze_personality
      - search_server_history
      - react_to_message
      - daily_recap
      - drama_judge
      - voice_speak
      - catch_me_up
      - fact_check
      - server_wiki
    supports_tools: true
    max_tokens: 2048
  groq/openai/gpt-oss-120b:
    tools:
      - web_search
      - get_weather
      - get_market_prices
      - visuals_core
      - calculate
      - get_current_time
      - wikipedia_search
      - set_reminder
      - read_url
      - get_user_profile
      - analyze_personality
      - search_server_history
      - react_to_message
      - catch_me_up
      - fact_check
      - server_wiki
    supports_tools: true
    max_tokens: 2048
# Both models passed a live completion probe on the deployment account.
fallback_models:
  - groq/openai/gpt-oss-120b
